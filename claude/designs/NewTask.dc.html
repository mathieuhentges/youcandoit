<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E4296}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F9; font-family: Roboto, system-ui, sans-serif; color: #1B1C1F; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 64px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex: none">
    <a href="Main.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 24px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1C1F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-size: 20px; font-weight: 500">New task</h1>
    <a href="Main.dc.html" style="height: 40px; padding: 0 20px; margin-right: 8px; border-radius: 20px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 500">Save</a>
  </header>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="title" style="font-size: 13px; font-weight: 500; color: #45494E">Title</label>
      <input id="title" type="text" value="Submit expense report" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid {{accent}}; border-radius: 12px; background: #FFFFFF; font: 400 16px Roboto, system-ui, sans-serif; color: #1B1C1F; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="desc" style="font-size: 13px; font-weight: 500; color: #45494E">Description</label>
      <textarea id="desc" rows="2" placeholder="Add details (optional)" style="box-sizing: border-box; padding: 14px 16px; border: 1px solid #C4C7CC; border-radius: 12px; background: #FFFFFF; font: 400 16px Roboto, system-ui, sans-serif; color: #1B1C1F; resize: none; height: 72px"></textarea>
    </div>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #45494E">Priority</legend>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{priorities}}" as="p" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 500 12px Roboto, system-ui, sans-serif; cursor: pointer; box-sizing: border-box; padding: 0; {{p.style}}"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{p.dot}}"></span>{{p.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="category" style="font-size: 13px; font-weight: 500; color: #45494E">Category</label>
      <div style="display: flex; gap: 10px; align-items: center">
        <button id="category" type="button" style="flex: 1; height: 52px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid #C4C7CC; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font: 400 16px Roboto, system-ui, sans-serif; color: #1B1C1F; cursor: pointer">Work<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <button type="button" style="height: 52px; padding: 0 14px; border: none; border-radius: 12px; background: transparent; color: {{accent}}; font: 500 14px Roboto, system-ui, sans-serif; cursor: pointer">+ New</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 500; color: #45494E">Deadline</span>
        <button type="button" aria-label="Has a deadline" aria-pressed="{{deadlinePressed}}" onClick="{{toggleDeadline}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 0 4px; cursor: pointer; display: flex; align-items: center; {{switchStyle}}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
      </div>
      <sc-if value="{{hasDeadline}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C4C7CC; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font: 400 15px Roboto, system-ui, sans-serif; color: #1B1C1F; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>Mon, Nov 2</button>
          <button type="button" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C4C7CC; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font: 400 15px Roboto, system-ui, sans-serif; color: #1B1C1F; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>17:00</button>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{hasDeadline}}" hint-placeholder-val="{{ true }}">
      <fieldset style="border: none; margin: 0; padding: 0">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 500; color: #45494E">Reminder</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{reminders}}" as="r" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; font: 500 14px Roboto, system-ui, sans-serif; cursor: pointer; box-sizing: border-box; {{r.style}}">{{r.label}}</button>
          </sc-for>
        </div>
      </fieldset>
    </sc-if>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1B6E5A","#6B3FA0","#1B1C1F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { priority: 'urgent', reminder: 'hour', hasDeadline: true };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const s = this.state || {};
    const PRIORITIES = [
      { id: 'urgent', label: 'Urgent', dot: '#D93025', bg: '#FCE8E6', fg: '#A50E0E' },
      { id: 'high', label: 'High', dot: '#F57C00', bg: '#FEEFE3', fg: '#8F4400' },
      { id: 'medium', label: 'Medium', dot: '#E0A100', bg: '#FEF7E0', fg: '#6F5200' },
      { id: 'low', label: 'Low', dot: '#4285F4', bg: '#E8F0FE', fg: '#174EA6' },
      { id: 'minimal', label: 'Minimal', dot: '#9AA0A6', bg: '#F1F3F4', fg: '#45494E' },
    ];
    const REMINDERS = [
      { id: 'none', label: 'None' },
      { id: 'at', label: 'At deadline' },
      { id: 'hour', label: '1 hour before' },
      { id: 'day', label: '1 day before' },
    ];
    const priorities = PRIORITIES.map((p) => {
      const on = p.id === s.priority;
      return {
        ...p,
        pressed: String(on),
        style: on
          ? 'background: ' + p.bg + '; color: ' + p.fg + '; border: 2px solid ' + p.dot
          : 'background: #FFFFFF; color: #1B1C1F; border: 1px solid #C4C7CC',
        pick: () => this.setState({ priority: p.id }),
      };
    });
    const reminders = REMINDERS.map((r) => {
      const on = r.id === s.reminder;
      return {
        ...r,
        pressed: String(on),
        style: on
          ? 'background: ' + accent + '; color: #FFFFFF; border: 1px solid ' + accent
          : 'background: #FFFFFF; color: #1B1C1F; border: 1px solid #C4C7CC',
        pick: () => this.setState({ reminder: r.id }),
      };
    });
    return {
      accent,
      priorities,
      reminders,
      hasDeadline: !!s.hasDeadline,
      deadlinePressed: String(!!s.hasDeadline),
      switchStyle: s.hasDeadline
        ? 'background: ' + accent + '; justify-content: flex-end'
        : 'background: #8A8F96; justify-content: flex-start',
      toggleDeadline: () => this.setState({ hasDeadline: !s.hasDeadline }),
    };
  }
}
</script>
</body>
</html>
