<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E4296}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F9; font-family: Roboto, system-ui, sans-serif; color: #1B1C1F; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 30px; font-weight: 500">All tasks</div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF"></div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF"></div>
    <div style="height: 64px; border-radius: 16px; background: #FFFFFF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(27,28,31,0.45); display: flex; align-items: center; justify-content: center; padding: 24px">
    <div role="dialog" aria-label="Appearance" style="width: 100%; max-width: 312px; background: #FFFFFF; border-radius: 28px; padding: 24px 24px 12px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 8px; font-size: 24px; font-weight: 400">Appearance</h2>
      <div role="radiogroup" style="display: flex; flex-direction: column">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="height: 52px; display: flex; align-items: center; gap: 16px; background: none; border: none; padding: 0; cursor: pointer; font: 400 16px Roboto, system-ui, sans-serif; color: #1B1C1F; text-align: left">
            <span style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; {{o.ring}}"><span style="width: 10px; height: 10px; border-radius: 50%; {{o.dot}}"></span></span>{{o.label}}
          </button>
        </sc-for>
      </div>
      <a href="Main.dc.html" style="align-self: flex-end; height: 40px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 500; color: {{accent}}">Cancel</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1B6E5A","#6B3FA0","#1B1C1F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'system' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const picked = (this.state && this.state.picked) || 'system';
    const OPTIONS = [
      { id: 'system', label: 'Follow phone' },
      { id: 'light', label: 'Light' },
      { id: 'dark', label: 'Dark' },
    ];
    return {
      accent,
      options: OPTIONS.map((o) => {
        const on = o.id === picked;
        return {
          ...o,
          checked: String(on),
          ring: 'border: 2px solid ' + (on ? accent : '#5F6368'),
          dot: 'background: ' + (on ? accent : 'transparent'),
          pick: () => this.setState({ picked: o.id }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
